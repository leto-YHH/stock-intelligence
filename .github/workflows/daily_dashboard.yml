name: 每日 Dashboard

on:
  schedule:
    # UTC 06:10 = 台灣時間 14:10（台股收盤後）
    - cron: "10 6 * * 1-5"
  workflow_dispatch:

jobs:
  daily-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安裝相依套件
        run: pip install -r requirements.txt --no-cache-dir

      - name: 執行每日 Dashboard
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER:           ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS:       ${{ secrets.GMAIL_APP_PASS }}
          REPORT_TO_EMAIL:      ${{ secrets.REPORT_TO_EMAIL }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          FINMIND_TOKEN:        ${{ secrets.FINMIND_TOKEN }}
          LINE_USER_ID:         ${{ secrets.LINE_USER_ID }}
          LINE_CHANNEL_TOKEN:   ${{ secrets.LINE_CHANNEL_TOKEN }}
        run: python -m src.dashboard.runner
      - name: 推送 JSON 到前端 repo
        env:
          FRONTEND_DEPLOY_TOKEN: ${{ secrets.FRONTEND_DEPLOY_TOKEN }}
        run: |
          git clone -b main https://x-access-token:${FRONTEND_DEPLOY_TOKEN}@github.com/leto-YHH/stock-intelligence-web.git frontend_repo
          mkdir -p frontend_repo/public/data
          cp public_data/dashboard.json frontend_repo/public/data/dashboard.json
          cd frontend_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/dashboard.json
          git diff --staged --quiet || git commit -m "chore: 更新 dashboard.json $(date +'%Y-%m-%d')"
          git push origin main
